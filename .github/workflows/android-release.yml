name: Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 1.0.1'
        required: true
        default: '1.0.1'
      version_code:
        description: 'Version code (must be higher than the last release)'
        required: true
        default: '2'
      min_version_code:
        description: 'Force apps below this code to update'
        required: true
        default: '1'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python dependencies
        run: pip install cryptography requests

      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          UPDATE_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${UPDATE_KEY_PEM}" ]; then
            echo "::error::APK_KEYSTORE_BASE64, APK_KEYSTORE_PASSWORD and UPDATE_SIGNING_KEY_PEM secrets are required."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          printf '%s' "$UPDATE_KEY_PEM" > "$RUNNER_TEMP/keys/update-private.pem"
          chmod 600 "$RUNNER_TEMP/keys/"*

      - name: Apply version
        env:
          VN: ${{ inputs.version_name }}
          VC: ${{ inputs.version_code }}
          MIN: ${{ inputs.min_version_code }}
        run: |
          python3 - <<'PY'
          import json, os, re
          p='release-config.json'
          c=json.load(open(p))
          vn=os.environ['VN']; vc=int(os.environ['VC']); mn=int(os.environ['MIN'])
          assert re.fullmatch(r'\d+\.\d+\.\d+', vn), 'version name must be X.Y.Z'
          assert vc > int(c['versionCode']), 'version code must increase'
          c['versionName']=vn; c['versionCode']=vc; c['minVersionCode']=mn
          json.dump(c, open(p,'w'), indent=2, ensure_ascii=False)
          open(p,'a').write('\n')
          PY

      - name: Build signed APK
        env:
          APK_KEYSTORE: ${{ runner.temp }}/keys/release.jks
          APK_STORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: satseva
        run: python3 scripts/build_apk.py

      - name: Validate APK
        run: python3 scripts/validate_apk.py

      - name: Core tests
        run: |
          mkdir -p tests/lib
          curl -sSL -o tests/lib/json.jar https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar
          bash scripts/test_core.sh

      - name: Sign the release feed
        env:
          UPDATE_PRIVATE_KEY: ${{ runner.temp }}/keys/update-private.pem
          VN: ${{ inputs.version_name }}
        run: |
          python3 scripts/publish.py \
            --apk "artifacts/SatSeva-${VN}.apk" \
            --min-app-code "${{ inputs.min_version_code }}" \
            --notes-en "Android ${VN}. Install to receive native improvements." \
            --notes-hi "एंड्रॉइड ${VN}। नई सुविधाओं के लिए इंस्टॉल करें।" \
            --notes-pa "ਐਂਡਰਾਇਡ ${VN}। ਨਵੀਆਂ ਸਹੂਲਤਾਂ ਲਈ ਇੰਸਟਾਲ ਕਰੋ।"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: SatSeva ${{ inputs.version_name }}
          body: |
            SatSeva ${{ inputs.version_name }} · सतसेवा

            **Android 8.0+ (API 26).** Download the APK below and open it.
            Android will ask you to allow installing from your browser or file manager — that is normal for an app distributed outside Play Store.

            If you already have SatSeva installed, this updates it in place and keeps your journal.
            Verify the download with the attached `.sha256` file if you wish.
          files: |
            artifacts/SatSeva-${{ inputs.version_name }}.apk
            artifacts/SatSeva-${{ inputs.version_name }}.apk.sha256
          fail_on_unmatched_files: true

      - name: Commit the updated feed
        run: |
          git config user.name "satseva-release"
          git config user.email "actions@users.noreply.github.com"
          git add release-config.json docs/updates
          git commit -m "release: Android v${{ inputs.version_name }}" || echo "nothing to commit"
          git push

      - name: Clean up signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
