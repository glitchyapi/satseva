name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'admin/**'
      - 'web/**'
      - 'docs/updates/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -eu
          mkdir -p _site/app _site/admin _site/updates
          cp -r site/. _site/
          cp -r web/. _site/app/
          cp -r admin/. _site/admin/
          cp -r docs/updates/. _site/updates/
          # The browser preview must never look like the installed app.
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
